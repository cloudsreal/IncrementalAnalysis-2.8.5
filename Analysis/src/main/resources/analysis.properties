# HDFS Configuration
# For local mode, use localhost:8000
# For cloud mode (EMR), use your EMR cluster address
hdfs.namenode.uri=hdfs://localhost:8000

# HDFS paths
hdfs.client.analysis.conf.path=/client/analysis_conf

# Redis Configuration
# For local mode, use localhost
# For cloud mode (EMR), use your Redis RDS address
redis.host=localhost
redis.port=6379
